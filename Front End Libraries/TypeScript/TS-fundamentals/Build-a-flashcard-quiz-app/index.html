<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='styles.css' rel='stylesheet' />
    <title>Build a Flashcard Quis App</title>
</head>

<body>
    <div id='container'>
        <div id='flashcard'>
            <div class='card-front'>
                <p class='question'></p>
            </div>
            <div class='card-back'>
                <p class='answer'></p>
            </div>
        </div>
    </div>
    <button type='button' id='delete-btn'>Delete</button>
    <form id='entry-form'>
        <label for='front-text'>Enter a question
            <textarea type='text' id='front-text'></textarea>
            
        </label>
        <label for='back-text'>Enter the answer
            <textarea id='back-text' type='text'></textarea>
            
        </label>
        <button type='submit' id='submit'>Submit</button>
    </form>

   <script src='dist/index.js'></script>
   <!-- <script src='index.ts'></script> for freeCodeCamp tests --> 
</body>

</html>
