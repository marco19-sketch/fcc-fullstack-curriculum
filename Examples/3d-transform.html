<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Transform Example</title>
    <style>
      .scene {
        width: 200px;
        height: 200px;
        perspective: 600px;
        border: 1px solid #ccc;
        margin: 100px auto;
      }

      .box {
        width: 100%;
        height: 100%;
        background-color: #3498db;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;                              
      }
      @keyframes spin {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }

      .box {
        animation: spin 5s infinite linear;        
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="box">3D Box</div>
    </div>
  </body>
</html>
