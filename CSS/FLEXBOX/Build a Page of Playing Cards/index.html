<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link href='styles.css' rel='stylesheet'>

</head>

<body>
  <main id='playing-cards'>
    <div class='card'>
      <div class='left'>A♠</div>
      <div class='middle'>♠</div>
      <div class='right'>A♠</div>
    </div>
    <div class='card'>
      <div class='left'>2♣</div>
      <div class='middle'>♣</div>
      <div class='right'>2♣</div>
    </div>
    <div class='card'>
      <div class='left red'>5♥</div>
      <div class='middle red'>♥</div>
      <div class='right red'>5♥</div>
    </div>
    <div class='card'>
      <div class='left red'>9♦</div>
      <div class='middle red'>♦</div>
      <div class='right red'>9♦</div>
    </div>
    <div class='card'>
      <div class='left'>A♠</div>
      <div class='middle'>♠</div>
      <div class='right'>A♠</div>
    </div>
  </main>

</body>

</html>
