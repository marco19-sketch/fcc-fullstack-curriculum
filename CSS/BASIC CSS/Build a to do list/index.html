<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel='stylesheet' href='styles.css'>
</head>

<body>
    <div class='container'>
        <h1>To Do</h1>
        <ul class='todo-list'>
            <li>
                <input type='checkbox' id='walk'>
                <label for='walk'>Walk the dog</label>
                <ul class='sub-item'>
                    <li><a class='sub-item-link' href='https://www.google.com' target='_blank'>Parks near me</a></li>
                </ul>
            </li>
            <li> 
                <input type='checkbox' id='buy'>
                <label for='buy'>Buy new laptop</label>
                <ul class='sub-item'>
                    <li><a class='sub-item-link' href='https://www.google.com' target='_blank'>Apple stores near me</a></li>
                </ul>
            </li>
            <li>
                <input type='checkbox' id='paint'>
                <label for='paint'>Paint the ceiling</label>
                <ul class='sub-item'>
                    <li><a class='sub-item-link' href='https://www.google.com' target='_blank'>Tutorial on painting</a></li>
                </ul>
            </li>
            <li>
                 <input type='checkbox' id='workout'>
                <label for='workout'>Workout</label>
                <ul class='sub-item'>
                    <li><a class='sub-item-link' href='https://www.google.com' target='_blank'>Workout routine</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
