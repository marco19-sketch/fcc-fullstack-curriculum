<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <h1 id="location"></h1>
    <div id="main-container">
      <div id="weather-main"></div>
      <img id="weather-icon" />
    </div>
    <hr />
    <section id="temp-humidity">
      <div id="temp-container">
        <div id="main-temperature"></div>
        <div id="feels-like"></div>
      </div>
      <div id="humidity"></div>
    </section>
    <hr />
    <section id="wind-container">
      <div id="winds">
        <div id="wind"></div>
        <div id="wind-gust"></div>
      </div>
      <svg visibility="hidden" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <g id="ic-weather-wind">
          <circle class="cls-1" cx="13" cy="6" r="2" />

          <circle class="cls-1" cx="20" cy="10" r="2" />

          <circle class="cls-1" cx="16" cy="18" r="2" />

          <line class="cls-1" x1="16" y1="16" x2="5" y2="16" />

          <line class="cls-1" x1="20" y1="12" x2="2" y2="12" />

          <line class="cls-1" x1="13" y1="8" x2="3" y2="8" />
        </g>
      </svg>
    </section>
    <hr />
    <div id="button-section">
      <button id="get-forecast">Get Forecast</button>
      <select>
        <option value=""></option>
        <option value="paris">Paris</option>
        <option value="london">London</option>
        <option value="tokyo">Tokyo</option>
        <option value="los angeles">Los Angeles</option>
        <option value="chicago">Chicago</option>
        <option value="new york">New York</option>
      </select>
    </div>
    <script src="script.js"></script>
  </body>
</html>
