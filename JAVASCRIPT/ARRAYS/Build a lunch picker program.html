<script>
const lunches = [];

const addLunchToEnd = (array, str) => {array.push(str);
console.log(`${str} added to the end of the lunch menu.`);
return array;
}

function addLunchToStart(array, str) {
  array.unshift(str);
  console.log(str + ' added to the start of the lunch menu.');
  return array;
}

const removeLastLunch = function(array) {
  let removed = array.pop();
   removed ? console.log(`${removed} removed from the end of the lunch menu.`) : console.log('No lunches to remove.');
  return array;
}

function removeFirstLunch(array) {
  let removed = array.shift();
  removed ? console.log(`${removed} removed from the start of the lunch menu.`) : console.log('No lunches to remove.');
  return array;
  
}

function getRandomLunch(array) {
  array.length > 0 
  ? console.log(`Randomly selected lunch: ${array[Math.floor(Math.random() * array.length)]}`)
  : console.log('No lunches available.');  
}

function showLunchMenu(array) {
  array.length > 0
  ? console.log(`Menu items: ${array}`)
  : console.log('The menu is empty.');
}

showLunchMenu(["Greens", "Corns", "Beans"]);
showLunchMenu(["Pizza", "Burger", "Fries", "Salad"]);
</script>
